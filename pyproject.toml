[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-qq-ollama-bot"
version = "0.1.0"
description = "A whitelist-only QQ group bot backed by a local Ollama model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "nonebot-adapter-onebot>=2.4,<3",
    "nonebot2[fastapi]>=2.4,<3",
    "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
qq-ollama-bot = "qq_ollama_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["qq_ollama_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

